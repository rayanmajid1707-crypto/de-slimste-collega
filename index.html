<!DOCTYPE html>

:root{
  --bg:#070d24;
  --panel:rgba(16, 29, 74, 0.82);
  --panel-border:rgba(99, 134, 235, 0.35);
  --paper:#f7f9ff;
  --red:#ff2a38;
  --red-glow:rgba(255, 42, 56, 0.55);
  --gold:#ffd43b;
  --gold-glow:rgba(255, 212, 59, 0.45);
  --ok:#2ce69b;
  --mute:#9cb0e8;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--paper);
  font:17px/1.45 "Helvetica Neue",system-ui,-apple-system,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* Studio Spotlights Achtergrond */
body::before, body::after{
  content:"";
  position:fixed;
  width:70vw;height:70vw;
  border-radius:50%;
  filter:blur(90px);
  z-index:-1;
  pointer-events:none;
  animation:spotMove 14s ease-in-out infinite alternate;
}
body::before{
  top:-25%;left:-15%;
  background:radial-gradient(circle, rgba(255,42,56,0.22), transparent 70%);
}
body::after{
  bottom:-25%;right:-15%;
  background:radial-gradient(circle, rgba(45,95,255,0.28), transparent 70%);
  animation-delay:-7s;
}
@keyframes spotMove{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(8%,6%) scale(1.12)}
}

#app{max-width:560px;margin:0 auto;padding:22px 16px 70px}
body.is-screen #app{max-width:1040px;padding:30px 28px}

}

  font-size:2.25rem;
  line-height:1;

  color:#fff;
  text-shadow:0 0 24px var(--red-glow), 0 4px 0 #7a0c14;

.brand h1 span{
  color:var(--gold);
