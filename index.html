<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De Slimste Collega</title>
<style>
:root{
  --bg:#070d24;
  --panel:rgba(16, 29, 74, 0.9);
  --panel-border:rgba(99, 134, 235, 0.4);
  --paper:#f7f9ff;
  --red:#ff2a38;
  --red-glow:rgba(255, 42, 56, 0.55);
  --gold:#ffd43b;
  --gold-glow:rgba(255, 212, 59, 0.45);
  --ok:#2ce69b;
  --mute:#9cb0e8;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--paper);
  font:17px/1.45 "Helvetica Neue",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
}
#app{max-width:560px;margin:0 auto;padding:22px 16px 70px}
body.is-screen #app{max-width:1040px;padding:30px 28px}

.brand{text-align:center;margin-bottom:22px}
.brand-sub{display:inline-block;font-size:.72rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.brand h1{font-family:"Arial Black","Impact",sans-serif;margin:0;font-size:2.25rem;text-transform:uppercase;color:#fff;text-shadow:0 0 24px var(--red-glow),0 4px 0 #7a0c14}
.brand h1 span{color:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:900;font-size:.75rem;text-transform:uppercase;padding:5px 12px;border-radius:99px;margin-bottom:10px}
.host-quip{background:rgba(255,212,59,0.12);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;font-style:italic;color:#ffe999;font-size:.95rem;margin:12px 0}
h2{font-family:"Arial Black",sans-serif;margin:0 0 12px;font-size:1.35rem}
.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:18px;padding:22px;margin:0 0 18px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.mute{color:var(--mute);font-size:.9rem}

input,textarea,select{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid rgba(99,134,235,.4);background:rgba(6,12,34,.85);color:var(--paper);margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{min-height:140px;font:13px/1.4 ui-monospace,monospace}

button{font:inherit;font-weight:900;width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:linear-gradient(180deg,#ffe066,#fcc419);color:#181200;cursor:pointer;box-shadow:0 5px 0 #b88600;text-transform:uppercase}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b88600}
button.alt{background:rgba(255,255,255,.07);color:var(--paper);border:2px solid rgba(99,134,235,.45);box-shadow:none;text-transform:none}
button.danger{background:linear-gradient(180deg,#ff4d58,#d91c28);color:#fff;box-shadow:0 4px 0 #800b13}
button.opt{background:rgba(28,50,118,.95);color:var(--paper);border:2px solid rgba(99,134,235,.45);text-align:left;display:flex;align-items:center;gap:14px;padding:14px;text-transform:none}
button.opt .letter{background:var(--gold);color:#141414;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900}

.clock-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.svg-clock{position:relative;width:82px;height:82px;flex-shrink:0}
.svg-clock svg{transform:rotate(-90deg);width:100%;height:100%}
.svg-clock circle{fill:rgba(130,12,22,.45);stroke-width:6}
.svg-clock .bg-ring{stroke:rgba(255,255,255,.15)}
.svg-clock .fg-ring{stroke:var(--gold);stroke-linecap:round}
.svg-clock .time-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Arial Black",sans-serif;font-size:1.75rem;color:#fff}
.q{font-size:1.35rem;font-weight:800;margin:8px 0 18px}
.good{color:var(--ok)}.bad{color:var(--red)}

ol.board{list-style:none;margin:0;padding:0}
ol.board li{display:flex;gap:10px;align-items:center;padding:11px;border-bottom:1px solid rgba(99,134,235,.2)}
ol.board li .rank{width:28px;height:28px;border-radius:50%;background:rgba(7,13,36,.8);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.82rem;color:var(--mute)}
ol.board li b{flex:1;font-weight:700}
ol.board li em{font-style:normal;font-weight:900;color:var(--gold);background:rgba(255,212,59,.12);padding:4px 10px;border-radius:8px}
ol.board li.me{background:rgba(255,212,59,.2);border-radius:10px;border:1px solid rgba(255,212,59,.5)}

.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(99,134,235,.25)}
.row b{flex:1}
.row button{width:auto;padding:7px 13px;margin:0}
.q-card{background:rgba(7,13,36,.75);border:1px solid rgba(99,134,235,.35);border-radius:12px;padding:14px;margin-bottom:12px}
.q-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.flex-gap{display:flex;gap:8px}
.flex-gap button{margin:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app"><div class="panel" style="text-align:center"><h2>Laden...</h2></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  try {
    const CFG = {
      title: "De Slimste Collega",
      hostPin: "4827",
      seconds: 25,
      firebase: {
        apiKey: "AIzaSyCJ2vesmFz9u3qysvCCY11_REYR8UZPIBI",
        authDomain: "de-slimste-collega.firebaseapp.com",
        databaseURL: "https://de-slimste-collega-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "de-slimste-collega",
        appId: "1:1029979378205:web:635f25e6eeeb125d5c2cf4"
      }
    };

    const SAMPLE = [
      {round:"Ronde 1 · 3-6-9", type:"mc", q:"Hoeveel provincies telt Vlaanderen?", options:["3","4","5","6"], correct:2},
      {round:"Ronde 1 · 3-6-9", type:"open", q:"Welke rivier stroomt dwars door Leuven?", answers:["Dijle","De Dijle"]},
      {round:"Ronde 2 · Open Deur", type:"mc", q:"Wat is het hoogste punt van België?", options:["Kemmelberg","Signaal van Botrange","Baraque Michel","Vaalserberg"], correct:1}
    ];

    const AVATARS = ["☕","📊","🖨️","📎","🍩","🧠","💼","🚀","🦉","🦊","⚡","🎯"];
    const getAvatar = name => AVATARS[Math.abs([...(name||'')].reduce((acc,c)=>acc+c.charCodeAt(0),0)) % AVATARS.length];

    const isHost = location.hash.toLowerCase().includes('host');
    const isScreen = location.hash.toLowerCase().includes('scherm');
    if (isScreen) document.body.classList.add('is-screen');

    let hostOk = sessionStorage.getItem('hostOk') === '1';
    let me = JSON.parse(localStorage.getItem('me') || 'null');
    let game = {phase:'lobby'}, players = {}, answers = {}, curQ = null, aRef = null, revealing = false;
    let draftName = '', draftAns = '', hostTab = 'visual';

    let db = null;
    try {
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps.length) firebase.initializeApp(CFG.firebase);
        db = firebase.database();
      }
    } catch(e) { console.error("DB error", e); }

    const now = () => Date.now();

    const getQs = () => {
      try {
        const s = localStorage.getItem('qs');
        return s ? JSON.parse(s) : SAMPLE;
      } catch(e) { return SAMPLE; }
    };
    const setQs = list => { localStorage.setItem('qs', JSON.stringify(list)); render(); };

    const calcPts = t => 100 + Math.round(50 * Math.max(0, 1 - t / (CFG.seconds * 1000)));
    const ranked = () => Object.entries(players).map(([id, p]) => ({id, ...p})).sort((a, b) => (b.score || 0) - (a.score || 0));

    if (db) {
      db.ref('game').on('value', s => { game = s.val() || {phase:'lobby'}; watch(); render(); });
      db.ref('players').on('value', s => {
        players = s.val() || {};
        if (me && !isHost && !isScreen && !players[me.id] && game.phase !== 'ended') {
          db.ref('players/' + me.id).set({name: me.name, score: 0, streak: 0});
        }
        if (!isHost && !isScreen && game.phase === 'question') return;
        render();
      });
    }

    function watch() {
      if (!db || game.q === curQ) return;
      if (aRef) aRef.off();
      curQ = game.q; answers = {};
      if (curQ == null) return;
      if (isHost || isScreen) {
        aRef = db.ref('answers/' + curQ);
        aRef.on('value', s => { answers = s.val() || {}; render(); });
      } else if (me) {
        aRef = db.ref(`answers/${curQ}/${me.id}`);
        aRef.on('value', s => { answers = s.val() ? {[me.id]: s.val()} : {}; render(); });
      }
    }

    window.join = function() {
      const n = draftName.trim().slice(0, 22);
      if (!n) return;
      me = {id: Math.random().toString(36).slice(2, 10), name: n};
      localStorage.setItem('me', JSON.stringify(me));
      if (db) db.ref('players/' + me.id).set({name: n, score: 0, streak: 0});
      watch(); render();
    };

    window.submit = function(v) {
      if (!db || !me || game.phase !== 'question' || answers[me.id]) return;
      if (v === '' || v == null) return;
      const t = now() - game.startedAt;
      db.ref(`answers/${game.q}/${me.id}`).set({value: v, t});
      draftAns = '';
    };

    window.startQ = function(i) {
      if (!db) return;
      const qs = getQs(), q = qs[i]; if (!q) return;
      const cur = {round: q.round || '', type: q.type, q: q.q};
      if (q.type === 'mc') cur.options = q.options;
      db.ref('game').set({phase: 'question', q: i, total: qs.length, cur, seconds: CFG.seconds, startedAt: firebase.database.ServerValue.TIMESTAMP});
    };

    window.reveal = async function() {
      if (!db || revealing || game.phase !== 'question') return;
      revealing = true;
      const q = getQs()[game.q];
      const all = (await db.ref('answers/' + game.q).once('value')).val() || {};
      const ups = {};
      for (const [pid, p] of Object.entries(players)) {
        const a = all[pid];
        const ok = a ? (q.type === 'mc' ? Number(a.value) === Number(q.correct) : (q.answers || []).some(x => x.toLowerCase() === String(a.value).toLowerCase().trim())) : false;
        const pts = ok ? calcPts(a.t) : 0;
        if (a) { ups[`${game.q}/${pid}/ok`] = ok; ups[`${game.q}/${pid}/pts`] = pts; }
        db.ref(`players/${pid}`).transaction(cur => {
          if (!cur) return cur;
          cur.score = (cur.score || 0) + pts;
          return cur;
        });
      }
      if (Object.keys(ups).length) await db.ref('answers').update(ups);
      await db.ref('game').update({phase: 'reveal', correct: q.type === 'mc' ? q.options[q.correct] : q.answers[0]});
      revealing = false;
    };

    window.checkPin = function() {
      const pin = document.getElementById('pin');
      if (pin && pin.value === CFG.hostPin) {
        sessionStorage.setItem('hostOk', '1');
        hostOk = true;
        render();
      } else alert('Verkeerde pincode');
    };

    window.addQ = () => { const qs = getQs(); qs.push({round:"Ronde", type:"mc", q:"Nieuwe vraag...", options:["A","B","C","D"], correct:0}); setQs(qs); };
    window.delQ = i => { const qs = getQs(); qs.splice(i,1); setQs(qs); };
    window.updateQField = (i, f, v) => { const qs = getQs(); qs[i][f] = v; localStorage.setItem('qs', JSON.stringify(qs)); if(f==='type') render(); };
    window.updateOpt = (i, oi, v) => { const qs = getQs(); qs[i].options[oi] = v; localStorage.setItem('qs', JSON.stringify(qs)); };

    function head() {
      return `<div class="brand"><div class="brand-sub">★ De Grote Kantoor Quiz ★</div><h1>De <span>Slimste</span> Collega</h1></div>`;
    }

    function board(n = 15) {
      const r = ranked();
      let h = r.slice(0, n).map((p, i) => `
        <li class="${me && p.id === me.id ? 'me' : ''}">
          <span class="rank">${i + 1}</span>
          <span>${getAvatar(p.name)}</span>
          <b>${p.name}</b>
          <em>${p.score || 0} sec</em>
        </li>`).join('');
      return `<div class="panel"><ol class="board">${h || '<li class="mute">Nog geen spelers in de lobby</li>'}</ol></div>`;
    }

    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (isScreen) {
        const np = Object.keys(players).length;
        const joinUrl = location.origin + location.pathname;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(joinUrl)}`;
        
        if (game.phase === 'lobby') {
          appEl.innerHTML = head() + `<div class="panel"><h2>Scan de QR-code om mee te spelen!</h2><p style="color:var(--gold);font-weight:bold">${joinUrl}</p><div style="text-align:center;margin:15px"><img src="${qrUrl}" style="background:#fff;padding:10px;border-radius:12px;width:180px"></div><p>${np} spelers verbonden: ${ranked().map(p=>p.name).join(', ') || 'nog niemand'}</p></div>`;
        } else if (game.phase === 'question') {
          appEl.innerHTML = head() + `<div class="panel"><div class="q">${game.cur.q}</div><p class="mute">${Object.keys(answers).length} van ${np} hebben geantwoord</p></div>`;
        } else {
          appEl.innerHTML = head() + `<div class="panel"><h2>Tussenstand</h2></div>` + board(15);
        }
        return;
      }

      if (isHost) {
        if (!hostOk) {
          appEl.innerHTML = head() + `<div class="panel"><h2>Hostscherm</h2><input id="pin" type="password" placeholder="Pincode"><button onclick="checkPin()">Open</button></div>`;
        } else if (game.phase === 'lobby') {
          const qs = getQs();
          appEl.innerHTML = head() + `<div class="panel"><h2>Regiekamer</h2><button onclick="startQ(0)">Start Spel</button></div><div class="panel"><h2>Vragen Bewerken</h2>${qs.map((q,i)=>`<div class="q-card"><input value="${q.q}" oninput="updateQField(${i},'q',this.value)"></div>`).join('')}<button class="alt" onclick="addQ()">+ Vraag</button></div>`;
        } else if (game.phase === 'question') {
          appEl.innerHTML = head() + `<div class="panel"><h2>Vraag bezig</h2><button onclick="reveal()">Toon Antwoord</button></div>`;
        } else {
          appEl.innerHTML = head() + `<div class="panel"><h2>Uitslag</h2><button onclick="startQ(${game.q+1})">Volgende</button></div>` + board();
        }
        return;
      }

      // Speler scherm
      if (!me) {
        appEl.innerHTML = head() + `<div class="panel"><h2>Meespelen</h2><input maxlength="22" placeholder="Jouw voornaam" oninput="draftName=this.value" onkeydown="if(event.key==='Enter')join()"><button onclick="join()">Start</button></div>`;
      } else if (game.phase === 'lobby') {
        appEl.innerHTML = head() + `<div class="panel" style="text-align:center"><h2>Welkom ${me.name}!</h2><p class="mute">Wacht op de quizmaster...</p></div>`;
      } else if (game.phase === 'question') {
        const c = game.cur;
        let body = answers[me.id] ? `<p class="good"><b>Antwoord verzonden!</b></p>` : (c.type === 'mc' ? c.options.map((o,i)=>`<button class="opt" onclick="submit(${i})"><span class="letter">${'ABCD'[i]}</span>${o}</button>`).join('') : `<input placeholder="Jouw antwoord" oninput="draftAns=this.value"><button onclick="submit(document.querySelector('input').value)">Verstuur</button>`);
        appEl.innerHTML = head() + `<div class="panel"><div class="q">${c.q}</div>${body}</div>`;
      } else {
        appEl.innerHTML = head() + `<div class="panel"><h2>Ronde afgelopen</h2></div>` + board();
      }
    }

    render();
  } catch(err) {
    document.getElementById('app').innerHTML = `<div class="panel"><h2>Fout</h2><p>${err.message}</p></div>`;
  }
});
</script>
</body>
</html>
